name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore CSharpMasteryHub/CSharpMasteryHub.csproj
      
    - name: Build
      run: dotnet build CSharpMasteryHub/CSharpMasteryHub.csproj --configuration Release --no-restore
      
    - name: Publish
      run: dotnet publish CSharpMasteryHub/CSharpMasteryHub.csproj -c Release -o ./publish
      
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'csharpmasteryhub2026'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
